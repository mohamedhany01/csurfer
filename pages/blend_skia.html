<!DOCTYPE html>
<html>
<head>
    <title>CSurfer Blend Mode Test</title>
</head>
<body style="background-color: white;">
    <h1 style="color: black;">Blend Mode Test</h1>

    <!-- Source Over (Default) -->
    <div style="background-color: orange; width: 400px; height: 100px;">
        <div style="background-color: blue; mix-blend-mode: source-over; width: 200px; height: 100px;">
            <h2 style="color: white;">Source Over (Default)</h2>
        </div>
    </div>

    <br><br>

    <!-- Difference -->
    <div style="background-color: orange; width: 400px; height: 100px;">
        <div style="background-color: blue; mix-blend-mode: difference; width: 200px; height: 100px;">
            <h2 style="color: white;">Difference (Pink)</h2>
        </div>
    </div>

    <br><br>

    <!-- Multiply -->
    <div style="background-color: orange; width: 400px; height: 100px;">
        <div style="background-color: blue; mix-blend-mode: multiply; width: 200px; height: 100px;">
            <h2 style="color: white;">Multiply (Dark)</h2>
        </div>
    </div>

</body>
</html>
