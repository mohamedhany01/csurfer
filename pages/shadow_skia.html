<!DOCTYPE html>
<html>
<head>
    <title>CSurfer Box Shadow Test</title>
</head>
<body style="background-color: white;">
    <h1 style="color: black;">Box Shadow Test</h1>

    <div style="background-color: blue; box-shadow: 10px 10px 20px black; width: 400px; height: 100px;">
        <h2 style="color: white;">Soft Black Shadow</h2>
    </div>

    <br><br>

    <div style="background-color: red; box-shadow: -5px -5px 10px blue; width: 400px; height: 100px;">
        <h2 style="color: white;">Blue Shadow (Negative Offset)</h2>
    </div>

    <br><br>

    <div style="background-color: yellow; border-radius: 20px; box-shadow: 5px 5px 15px gray; width: 400px; height: 100px;">
        <h2 style="color: black;">Rounded with Shadow</h2>
    </div>
</body>
</html>
