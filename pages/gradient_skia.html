<!DOCTYPE html>
<html>
<head>
    <title>CSurfer Gradient Test</title>
</head>
<body style="background-color: white;">
    <h1 style="color: black;">Linear Gradient Test</h1>

    <div style="background: linear-gradient(to right, red, yellow); width: 400px; height: 100px;">
        <h2 style="color: black;">To Right: Red to Yellow</h2>
    </div>

    <br><br>

    <div style="background: linear-gradient(to bottom, blue, green); width: 400px; height: 100px;">
        <h2 style="color: white;">To Bottom: Blue to Green</h2>
    </div>

    <br><br>

    <div style="background: linear-gradient(to top, orange, purple); width: 400px; height: 100px;">
        <h2 style="color: white;">To Top: Orange to Purple</h2>
    </div>

    <br><br>

    <div style="background: linear-gradient(to left, cyan, magenta); width: 400px; height: 100px;">
        <h2 style="color: black;">To Left: Cyan to Magenta</h2>
    </div>

    <br><br>

    <div style="background: linear-gradient(red, blue); width: 400px; height: 100px;">
        <h2 style="color: white;">Default (To Bottom): Red to Blue</h2>
    </div>
</body>
</html>
